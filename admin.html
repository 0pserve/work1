<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root { --primary: #bd2aa4; --dark: #333; --bg-gray: #f8f9fb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background: var(--bg-gray); color: #333; }

        /* 헤더 및 메뉴 */
        .header{height:64px; display:flex; justify-content:space-between; align-items:center; padding:0 24px; background:#fff; border-bottom:1px solid #E0E4EA; position:sticky; top:0; z-index:100;}
        .header h1{font-size:20px; font-weight:700; color:#bd2aa4; cursor:pointer;}
        .menu{position:fixed; top:0; right:0; width:280px; height:100%; background:#fff; padding:30px; transform:translateX(100%); transition:.3s; z-index:1000; box-shadow:-10px 0 20px rgba(0,0,0,0.05)}
        .menu.open{transform:translateX(0)}
        .menu a{display:block; margin:25px 0; font-size:16px; font-weight:600; color:#444; text-decoration:none; cursor:pointer;}

        /* 히어로 배너 */
        .hero {
            height: 300px;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1600');
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; color: #fff; text-align: center;
        }
        .hero h2 { font-size: 36px; letter-spacing: -1px; }

        /* 컨텐츠 영역 */
        #content-area { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        .admin-container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 20px; }
        .admin-header h1 { font-size: 24px; color: var(--dark); }
        
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-gray); padding: 20px; border-radius: 8px; border: 1px solid #eee; text-align: center; }
        .stat-card p { font-size: 14px; color: #888; margin-bottom: 5px; }
        .stat-card h2 { color: var(--primary); font-size: 24px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { background: #f8f9fb; padding: 15px; text-align: left; border-bottom: 2px solid #eee; color: #666; }
        td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: middle; line-height: 1.5; }
        tr:hover { background: #fdf8fd; }

        .btn-excel { background: #27ae60; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-delete { color: #ff4d4d; border: 1px solid #ff4d4d; background: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background: #ff4d4d; color: #fff; }

        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; background: #eee; }
        .badge-status { background: #e1f5fe; color: #039be5; }
    </style>
</head>
<body>

<div class="header">
    <h1 onclick="location.href='main2.html'">제목입니다</h1>
    <div onclick="toggleMenu()" style="cursor:pointer; font-size:24px;">☰</div>
</div>

<div class="menu" id="sideMenu">
    <div onclick="toggleMenu()" style="text-align:right; cursor:pointer; font-size:24px;">✕</div>
    <a onclick="toggleMenu(); location.href='main2.html'">🏨 숙박예약</a>
    <a onclick="toggleMenu(); location.href='main2.html#login'">🔍 예약조회</a>
    <a onclick="toggleMenu(); location.href='main2.html#cs'">📞 고객센터</a>
    <a onclick="toggleMenu(); location.href='main2.html#faq'">❓ 자주 묻는 질문</a>
</div>

<div class="hero">
    <div>
        <h2>숙박 예약 관리 시스템</h2>
        <p>Reservation Management System</p>
    </div>
</div>

<div id="content-area">
<div class="admin-container">
    <div class="admin-header">
        <h1>숙박 예약 관리 시스템</h1>
        <button class="btn-excel" onclick="downloadExcel()">📊 엑셀 다운로드 (CSV)</button>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <p>총 예약 건수</p>
            <h2 id="total-count">0건</h2>
        </div>
        <div class="stat-card">
            <p>총 결제 예정 금액</p>
            <h2 id="total-revenue">₩ 0</h2>
        </div>
        <div class="stat-card">
            <p>최근 업데이트</p>
            <h2 id="last-update" style="font-size: 16px; margin-top: 10px;">-</h2>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>예약번호/일시</th>
                <th>예약자 정보 (국문/영문)</th>
                <th>소속</th>
                <th>연락처/이메일</th>
                <th>호텔/객실타입</th>
                <th>숙박기간</th>
                <th>결제금액</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="admin-table-body">
            </tbody>
    </table>
</div>
</div>

<script>
    // 메뉴 토글 함수
    function toggleMenu() { document.getElementById("sideMenu").classList.toggle("open"); }
    
    // 페이지 로드 시 예약 로드
    window.addEventListener('load', () => {
        loadReservations();
    });

    function loadReservations() {
        const data = StorageService.getReservations()
        const tbody = document.getElementById('admin-table-body');
        let totalRevenue = 0;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:50px; color:#999;">접수된 예약 내역이 없습니다.</td></tr>';
            return;
        }

        tbody.innerHTML = data.reverse().map(item => {
            // 숫자만 추출하여 매출 합산
            const priceNum = parseInt(item.totalPrice.replace(/[^0-9]/g, '')) || 0;
            totalRevenue += priceNum;

            return `
                <tr>
                    <td style="font-size:12px;">
                        <span class="badge">${item.id}</span><br>
                        <small style="color:#888;">${item.orderDate}</small>
                    </td>
                    <td>
                        <strong>${item.guestName}</strong><br>
                        <small style="color:#666;">${item.guestNameEn || '-'}</small>
                    </td>
                    <td>${item.guestAff || '-'}</td>
                    <td style="font-size:13px;">
                        ${item.guestPhone}<br>
                        <small style="color:var(--primary);">${item.guestEmail}</small>
                    </td>
                    <td>
                        <strong>${item.hotelName}</strong><br>
                        <span class="badge badge-status">${item.roomType}</span>
                    </td>
                    <td style="font-size:13px;">${item.dateRange}</td>
                    <td style="font-weight:700; color:var(--primary);">${item.totalPrice}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteRes('${item.id}')">삭제</button>
                    </td>
                </tr>
            `;
        }).join('');

        document.getElementById('total-count').innerText = data.length + "건";
        document.getElementById('total-revenue').innerText = "₩ " + totalRevenue.toLocaleString();
        document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
    }

    // 예약 삭제 기능
    function deleteRes(id) {
        if(confirm('정말로 이 예약 내역을 삭제하시겠습니까?')) {
            let data = StorageService.deleteReservation(id)
            data = data.filter(item => item.id !== id);
            localStorage.setItem('reservations', JSON.stringify(data));
            loadReservations();
        }
    }

    // 엑셀(CSV) 다운로드 기능
    function downloadExcel() {
        const data = JSON.parse(localStorage.getItem('reservations') || '[]');
        if(data.length === 0) { alert('다운로드할 데이터가 없습니다.'); return; }

        let csv = "\uFEFF"; // 한글 깨짐 방지 BOM
        csv += "예약번호,신청일시,이름(국문),이름(영문),소속,연락처,이메일,호텔명,객실타입,숙박기간,결제금액\n";

        data.forEach(item => {
            csv += `"${item.id}","${item.orderDate}","${item.guestName}","${item.guestNameEn}","${item.guestAff}","${item.guestPhone}","${item.guestEmail}","${item.hotelName}","${item.roomType}","${item.dateRange}","${item.totalPrice.replace(/,/g,'')}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `IMWA2026_예약명단_${new Date().toLocaleDateString()}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

</script>

</body>
</html>
