<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Pretendard', sans-serif; background: #000; }
        .intro-bg {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://imwa2026org.mice.link/static/img/main/visual_pc.jpg'); /* 원본 이미지 경로 가정 */
            background-size: cover; background-position: center; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff;
        }
        .btn-enter {
            margin-top: 30px; padding: 15px 60px; border: 1px solid #fff; background: rgba(255,255,255,0.1);
            color: #fff; cursor: pointer; border-radius: 50px; font-size: 16px; transition: 0.3s;
        }
        .btn-enter:hover { background: #fff; color: #000; }
    </style>
</head>
<body>
    <div class="intro-bg">
        <p style="letter-spacing: 5px; opacity: 0.8;">Welcome</p>
        <h1 style="font-size: 5rem; margin: 10px 0;">Title</h1>
        <button class="btn-enter" onclick="location.href='main2.html'">ENTER</button>
    </div>
</body>
</html>
