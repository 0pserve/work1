<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>맨위 제목 입니다.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="data.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <style>
        :root { --primary-color: #bd2aa4; --bg-gray: #f8f9fb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-gray); padding-bottom: 60px; color: #333; }

        /* 헤더 및 메뉴 */
        .header{height:64px; display:flex; justify-content:space-between; align-items:center; padding:0 24px; background:#fff; border-bottom:1px solid #E0E4EA; position:sticky; top:0; z-index:100;}
        .header h1{font-size:20px; font-weight:700; color:#bd2aa4; cursor:pointer;}
        .menu{position:fixed; top:0; right:0; width:280px; height:100%; background:#fff; padding:30px; transform:translateX(100%); transition:.3s; z-index:1000; box-shadow:-10px 0 20px rgba(0,0,0,0.05)}
        .menu.open{transform:translateX(0)}
        .menu a{display:block; margin:25px 0; font-size:16px; font-weight:600; color:#444; text-decoration:none; cursor:pointer;}

        /* 히어로 배너 */
        .hero {
            height: 300px;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1600');
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; color: #fff; text-align: center;
        }
        .hero h2 { font-size: 36px; letter-spacing: -1px; }

        /* 컨텐츠 영역 */
        #content-area { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

        .container { max-width: 900px; margin: 0 auto; padding: 0; }

        /* 상단 호텔 비주얼 */
        .hotel-visual { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #eee; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .hotel-main-img { width: 100%; height: 400px; object-fit: cover; background: #eee; }
        .hotel-intro { padding: 30px; }
        .venue-tag { display: inline-block; background: var(--primary-color); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 12px; }
        .hotel-title { font-size: 28px; color: #222; margin-bottom: 10px; }
        .hotel-address { color: #888; font-size: 14px; margin-bottom: 20px; }
        .hotel-description { line-height: 1.8; color: #555; font-size: 15px; border-top: 1px solid #f4f4f4; padding-top: 20px; }

        /* 섹션 카드 스타일 */
        .form-section { background: #fff; border-radius: 12px; border: 1px solid #ddd; overflow: hidden; margin-bottom: 25px; }
        .section-header { background: #333; color: #fff; padding: 15px 20px; font-weight: 700; font-size: 16px; }
        .section-body { padding: 25px; }

        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
        .input-item { width: 100%; border: 1px solid #ccc; padding: 12px; border-radius: 6px; font-size: 15px; margin-bottom: 15px; outline: none; transition: 0.2s; }
        .input-item:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(189, 42, 164, 0.1); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .policy-box { background: #f4f4f4; padding: 15px; font-size: 13px; color: #666; height: 100px; overflow-y: scroll; border: 1px solid #eee; margin-bottom: 15px; line-height: 1.6; }

        /* 하단 가격 및 버튼 */
        .footer-payment { text-align: center; background: #fff; border-top: 1px solid #eee; padding: 40px 20px; border-radius: 12px; margin-top: 20px; }
        .total-price { font-size: 36px; font-weight: 800; color: var(--primary-color); margin: 10px 0 25px 0; }
        .btn-submit { background: var(--primary-color); color: #fff; border: none; padding: 20px 60px; font-size: 18px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; max-width: 400px; transition: 0.3s; }
        .btn-submit:hover { background: #961d82; transform: translateY(-2px); }

        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .hotel-main-img { height: 250px; } }
    </style>
</head>
<body>

<div class="header">
    <h1 onclick="location.href='main2.html'">제목입니다</h1>
    <div onclick="toggleMenu()" style="cursor:pointer; font-size:24px;">☰</div>
</div>

<div class="menu" id="sideMenu">
    <div onclick="toggleMenu()" style="text-align:right; cursor:pointer; font-size:24px;">✕</div>
    <a onclick="toggleMenu(); location.href='main2.html'">🏨 숙박예약</a>
    <a onclick="toggleMenu(); location.href='main2.html#login'">🔍 예약조회</a>
    <a onclick="toggleMenu(); location.href='main2.html#cs'">📞 고객센터</a>
    <a onclick="toggleMenu(); location.href='main2.html#faq'">❓ 자주 묻는 질문</a>
</div>

<div class="hero">
    <div>
        <h2>숙박 예약 상세</h2>
        <p>Hotel Reservation Details</p>
    </div>
</div>

<div id="content-area">
    <div class="booking-container" style="display: flex; gap: 30px; align-items: flex-start;">
        
        <div class="form-wrapper" style="flex: 7;">
            
            <div class="form-section">
                <div class="section-header" style="background:#000000; color:#ffffff; border-bottom:1px solid #ffffff;">로그인 정보 <span style="font-size:12px; font-weight:400; color:#ffffff;">(예약조회 시 인증에 사용됩니다.)</span></div>
                <div class="section-body">
                    <label>이메일 (Email) <span style="color:red;">*</span></label>
                    <input type="email" id="gEmail" class="input-item" placeholder="example@email.com">
                    
                    <div class="grid-2">
                        <div>
                            <label>비밀번호 <span style="color:red;">*</span></label>
                            <input type="password" id="gPw" class="input-item" placeholder="4~20자 입력">
                        </div>
                        <div>
                            <label>비밀번호 확인 <span style="color:red;">*</span></label>
                            <input type="password" id="gPwConfirm" class="input-item" placeholder="비밀번호를 한번 더 입력">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header"> 대표예약자 정보</div>
                <div class="section-body">
                    <div class="grid-2">
                        <div>
                            <label>성명<span style="color:red;">*</span></label>
                            <input type="text" id="gName" class="input-item">
                        </div>
                        <div>
                            <label>생년월일 <span style="color:red;">*</span></label>
                            <input type="text" id="gBirth" class="input-item" placeholder="YYYYMMDD">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div>
                            <label>연락처 <span style="color:red;">*</span></label>
                            <input type="text" id="gPhone" class="input-item" placeholder="숫자만 입력">
                        </div>
                        <div>
                            <label>국적 <span style="color:red;">*</span></label>
                            <select id="gNation" class="input-item">
                                <option value="">국가 선택 (Select Country)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">STEP 3. 결제 정보</div>
                <div class="section-body">
                    <div style="background:#fffbe6; padding:15px; border:1px solid #ffe58f; margin-bottom:15px; font-size:13px;">
                        * 예약 후 체크아웃 날짜 이전까지 온라인 재결제를 원하시면 선택하세요.
                    </div>
                    <label>카드 정보 입력</label>
                    <input type="text" id="cardNum" class="input-item" placeholder="Card number (숫자만 입력)">
                    <div class="grid-2">
                        <input type="text" id="cardExp" class="input-item" placeholder="MM / YY">
                        <input type="password" id="cardPw" class="input-item" placeholder="비밀번호 앞 2자리">
                    </div>
                </div>
            </div>
        </div>

        <div class="summary-wrapper" style="flex: 3; position: sticky; top: 80px;">
            <div style="background:#fff; border:1px solid #ddd; border-radius:12px; overflow:hidden;">
                <img id="view-img-side" src="" style="width:100%; height:180px; object-fit:cover;">
                <div style="padding:20px;">
                    <h3 id="view-name-side" style="font-size:18px; margin-bottom:10px;">Hotel Name</h3>
                    <div style="font-size:14px; color:#666; line-height:1.8;">
                        <p>박수: <span id="summary-stay">0</span>박</p>
                        <p>체크인: <span id="summary-in">-</span></p>
                        <p>체크아웃: <span id="summary-out">-</span></p>
                    </div>
                    <hr style="margin:15px 0;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>총 금액</span>
                        <strong id="totalAmountSide" style="color:var(--primary-color); font-size:22px;">₩ 0</strong>
                    </div>
                    <button class="btn-submit" onclick="submitReservation()" style="width:100%; margin-top:20px; padding:15px;">예약하기</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 메뉴 토글 함수
    function toggleMenu() { document.getElementById("sideMenu").classList.toggle("open"); }
    
    // 1. URL 파라미터에서 데이터 로드
    const params = new URLSearchParams(window.location.search);
    const hotelId = params.get('id');
    const hotel = HOTEL_DATA.find(h => h.id == hotelId);

    if (!hotel) {
        alert("데이터가 없습니다.");
        location.href = 'main2.html';
    } else {
        document.getElementById('view-img').src = hotel.img;
        document.getElementById('view-name').innerText = hotel.name;
        document.getElementById('view-address').innerText = "📍 " + hotel.address;
        document.getElementById('view-desc').innerText = hotel.desc;
    }

    //가격 계산 함수 정의
    function updateTotalPrice() {
        const roomType = document.getElementById('roomType').value;
        const datePicker = document.querySelector("#dateRange")._flatpickr;
        
        if (datePicker && datePicker.selectedDates.length === 2) {
            const selectedDates = datePicker.selectedDates;
            const diff = Math.ceil(Math.abs(selectedDates[1] - selectedDates[0]) / (1000 * 60 * 60 * 24));
            
            // 데이터 구조에 맞게 가격 가져오기 (hotel.roomPrices[방타입])
            const pricePerNight = hotel.roomPrices[roomType] || 0; 
            const total = diff * pricePerNight;
            
            document.getElementById('totalAmount').innerText = "₩ " + total.toLocaleString();
        }
    }
    // 2. 날짜 선택기
    flatpickr("#dateRange", {
        mode: "range",
        dateFormat: "Y-m-d",
        defaultDate: ["2026-09-07", "2026-09-11"],
        onChange: function() {
            updateTotalPrice();
            }
        }
    );
        // 방 타입(select)을 바꿀 때마다 가격을 다시 계산하도록 이벤트 연결
    document.getElementById('roomType').addEventListener('change', updateTotalPrice);

    // 페이지 로드 시 초기 가격 한 번 계산
    if (hotel) {
        updateTotalPrice();
    }

    // 요약 정보 실시간 업데이트
    function updateSummary(rangeStr, total) {
        if(rangeStr.includes('to')) {
            const dates = rangeStr.split(' to ');
            document.getElementById('summary-in').innerText = dates[0];
            document.getElementById('summary-out').innerText = dates[1];
            
            const start = new Date(dates[0]);
            const end = new Date(dates[1]);
            const diff = Math.ceil((end - start) / (1000*60*60*24));
            document.getElementById('summary-stay').innerText = diff;
        }
        document.getElementById('totalAmountSide').innerText = total;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const nationSelect = document.getElementById('gNation');
    
    // data.js에 저장한 COUNTRY_DATA 배열을 순회하며 option 생성
        if (nationSelect && typeof COUNTRY_DATA !== 'undefined') {
            COUNTRY_DATA.forEach(country => {
                const opt = document.createElement('option');
                opt.value = country.code;
                opt.textContent = country.name;
            
            // 대한민국(KR)을 기본값으로 지정
                if(country.code === "KR") opt.selected = true;
            
                nationSelect.appendChild(opt);
            });
        }
    });
    // 3. 통합 예약 신청 함수 (유효성 검사 + 저장)
    function submitReservation() {
        // 값 가져오기
        const gName = document.getElementById('gName').value.trim();
        const gNameEn = document.getElementById('gNameEn').value.trim();
        const gAff = document.getElementById('gAff').value.trim();
        const gEmail = document.getElementById('gEmail').value.trim();
        const gPhone = document.getElementById('gPhone').value.trim();
        const agree = document.getElementById('agree').checked;
        const roomType = document.getElementById('roomType').value;
        const dateRange = document.getElementById('dateRange').value;
        const gPw = document.getElementById('gPw').value;
        const gPwConfirm = document.getElementById('gPwConfirm').value

        // 유효성 검사
        if (gPw !== gPwConfirm) return alert("비밀번호가 일치하지 않습니다.");
        if (gPw.length < 4) return alert("비밀번호는 4자 이상 입력해주세요.");
        if (!gName) return alert("예약자 성함(국문)을 입력해주세요.");
        if (!gEmail.includes('@')) return alert("올바른 이메일 주소를 입력해주세요.");
        if (!gPhone) return alert("연락처를 입력해주세요.");
        if (!dateRange) return alert("숙박 기간을 선택해주세요.");
        if (!agree) return alert("취소 및 환불 규정에 동의하셔야 예약이 가능합니다.");

        // 저장할 객체 생성
        const reservationData = {
            id: "BK-" + Date.now(),
            hotelName: hotel.name,
            guestName: gName,
            guestNameEn: gNameEn,
            guestAff: gAff,
            guestEmail: gEmail,
            guestPhone: gPhone,
            roomType: roomType,
            dateRange: dateRange,
            totalPrice: document.getElementById('totalAmount').innerText,
            orderDate: new Date().toLocaleString(),
            status: '결제대기',
            guestPassword: gPw, // 비회원 조회용 비밀번호 저장
            guestBirth: document.getElementById('gBirth').value,
            status: '결제완료'
        };

        // 로컬스토리지 저장
        StorageService.saveReservation(reservationData);

        alert("예약 신청이 성공적으로 완료되었습니다!");
        location.href = 'main2.html';
    }
</script>

</body>
</html>
