<form onsubmit="return handleJoin(event)">
    <input type="text" id="joinName" placeholder="이름(실명)" required>
    <input type="email" id="joinEmail" placeholder="이메일(아이디)" required>
    <input type="password" id="joinPw" placeholder="비밀번호" required>
    <button type="submit">가입하기</button>
</form>

<script>
function handleJoin(e) {
    e.preventDefault();
    const userData = {
        name: document.getElementById('joinName').value,
        email: document.getElementById('joinEmail').value,
        pw: document.getElementById('joinPw').value
    };
    
    const result = StorageService.signup(userData);
    alert(result.message);
    if(result.success) location.href = 'main2.html';
}
</script>
